<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Press — GTA-style Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <header>
      <h1>VICE PRESS</h1>
      <p class="tag">Turn any photo into GTA-style cover art. Offline, on your machine.</p>
    </header>

    <div class="group">
      <h2>Photos</h2>
      <div id="dropZone" class="drop">Drop photos here, or <label class="file-label">choose files <input id="photoFile" type="file" accept="image/*" multiple></label></div>
      <div id="thumbs" class="thumbs" aria-label="Photos"></div>
      <p class="hint">Click a photo to put it in the selected panel. Three samples are built in.</p>
    </div>

    <div class="group">
      <h2>Layout</h2>
      <div class="btn-grid" id="layouts">
        <button type="button" class="layout-btn" data-layout="grid4"><span class="mini m-grid4"></span>Four Panel</button>
        <button type="button" class="layout-btn" data-layout="hero3"><span class="mini m-hero3"></span>Hero + Three</button>
        <button type="button" class="layout-btn" data-layout="fullbleed"><span class="mini m-full"></span>Full Bleed</button>
        <button type="button" class="layout-btn" data-layout="grid9"><span class="mini m-grid9"></span>Nine Panel</button>
        <button type="button" class="layout-btn" data-layout="tilt"><span class="mini m-tilt"></span>Tilted Stack</button>
        <button type="button" class="layout-btn" data-layout="strip"><span class="mini m-strip"></span>Triptych</button>
      </div>
    </div>

    <div class="group">
      <h2>Grade</h2>
      <div class="btn-grid" id="grades">
        <button type="button" class="grade-btn" data-grade="sunset" style="--sw: linear-gradient(135deg,#1a0b2e,#e8543f,#ffb347)">Sunset</button>
        <button type="button" class="grade-btn" data-grade="neon" style="--sw: linear-gradient(135deg,#04121f,#ff2e88,#00e5ff)">Neon</button>
        <button type="button" class="grade-btn" data-grade="noir" style="--sw: linear-gradient(135deg,#000,#9a9a9a,#fff)">Noir</button>
        <button type="button" class="grade-btn" data-grade="gold" style="--sw: linear-gradient(135deg,#120a02,#c98a2e,#ffe9b0)">Gold Hour</button>
        <button type="button" class="grade-btn" data-grade="vice" style="--sw: linear-gradient(135deg,#160a2e,#c22a7a,#ff9a5c)">Vice</button>
        <button type="button" class="grade-btn" data-grade="aqua" style="--sw: linear-gradient(135deg,#02141a,#19b3a6,#d8fff4)">Aqua</button>
        <button type="button" class="grade-btn" data-grade="natural" style="--sw: linear-gradient(135deg,#222,#888,#ddd)">Natural</button>
      </div>
    </div>

    <div class="group">
      <h2>Caption</h2>
      <label>Title <input id="title" type="text" maxlength="48" value="Neon Shore"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="48" value="a vice city story"></label>
      <label>Title colour
        <select id="titleColor">
          <option value="white">White</option>
          <option value="sunset">Sunset gradient</option>
        </select>
      </label>
      <label class="check"><input id="outline" type="checkbox" checked> Bold outline</label>
      <label class="check"><input id="halftone" type="checkbox" checked> Halftone band</label>
      <label>Badge <input id="badge" type="text" maxlength="20" value="Launch Week"></label>
      <label>Heat
        <select id="heat">
          <option value="0">No stars</option>
          <option value="1">★</option>
          <option value="2">★★</option>
          <option value="3">★★★</option>
          <option value="4" selected>★★★★</option>
          <option value="5">★★★★★</option>
        </select>
      </label>
    </div>

    <div class="group">
      <h2 id="panelLabel">Panel 1</h2>
      <label>Photo
        <select id="panelPhoto"></select>
      </label>
      <label>Zoom <span id="zoomVal">100%</span>
        <input id="zoom" type="range" min="1" max="3" step="0.05" value="1">
      </label>
      <label>Pan X <input id="panX" type="range" min="-0.5" max="0.5" step="0.01" value="0"></label>
      <label>Pan Y <input id="panY" type="range" min="-0.5" max="0.5" step="0.01" value="0"></label>
      <button id="resetPanel" type="button" class="ghost">Reset panel</button>
      <p class="hint">Click a panel on the cover to select it, drag to pan, scroll to zoom.</p>
    </div>

    <div class="group">
      <h2>Export</h2>
      <div class="btn-grid">
        <button type="button" class="size-btn" data-size="1080x1080">Square 1080²</button>
        <button type="button" class="size-btn" data-size="1080x1350">Portrait 1080×1350</button>
        <button type="button" class="size-btn" data-size="1920x1080">Wide 1920×1080</button>
        <button type="button" class="size-btn" data-size="1080x1920">Story 1080×1920</button>
      </div>
      <div class="row">
        <button id="exportBtn" type="button" class="primary">Export PNG</button>
        <button id="exportAllBtn" type="button">Export all sizes</button>
      </div>
      <div class="row">
        <button id="undoBtn" type="button" class="ghost">Undo</button>
        <button id="redoBtn" type="button" class="ghost">Redo</button>
      </div>
      <label class="check"><input id="grain" type="checkbox" checked> Film grain</label>
      <label class="check"><input id="vignette" type="checkbox" checked> Vignette</label>
      <p id="status" role="status"></p>
    </div>
  </section>

  <section class="stage" aria-label="Cover preview">
    <canvas id="cover" width="560" height="560" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
